<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Bal des 3èmes — Camille Sée</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet" />
<style>
  :root {
    --noir: #0b0a0a;
    --noir-soft: #161413;
    --noir-card: #1d1a18;
    --or: #d4af37;
    --or-clair: #e8c96a;
    --or-fonce: #9c7d20;
    --creme: #f4ead5;
    --rouge: #b3251f;
    --gris: #6b6358;
    --gris-clair: #c9c1b3;
    --vert-ok: #4d8c5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--noir);
    color: var(--creme);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background décoratif Art Déco */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(179, 37, 31, 0.06), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0, transparent 60px, rgba(212, 175, 55, 0.015) 60px, rgba(212, 175, 55, 0.015) 61px);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* === ACCUEIL === */
  .hero {
    height: 100vh;
    height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .ornement {
    color: var(--or);
    font-size: 22px;
    letter-spacing: 12px;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  .hero h1 {
    font-family: 'Italiana', serif;
    font-size: clamp(32px, 6.5vw, 60px);
    font-weight: 400;
    color: var(--or-clair);
    line-height: 1.05;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    text-transform: uppercase;
  }
  .hero h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 2.6vw, 24px);
    font-weight: 400;
    font-style: italic;
    color: var(--creme);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .hero .college {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gris-clair);
    opacity: 0.7;
    margin-bottom: 14px;
  }
  .hero .baseline {
    color: var(--gris-clair);
    max-width: 480px;
    margin: 18px auto 22px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 2.2vw, 18px);
    font-style: italic;
    line-height: 1.4;
  }
  .cta-principal {
    background: linear-gradient(135deg, var(--or-fonce), var(--or));
    color: var(--noir);
    border: none;
    padding: 16px 42px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25);
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .cta-principal:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4);
  }
  .lien-admin {
    position: absolute;
    bottom: 14px;
    right: 16px;
    color: var(--or);
    text-decoration: none;
    opacity: 0.55;
    transition: all 0.25s;
    line-height: 0;
    padding: 4px;
  }
  .lien-admin svg {
    width: 26px;
    height: 26px;
    display: block;
  }
  .lien-admin:hover {
    opacity: 1;
    transform: rotate(-15deg) scale(1.1);
    filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
  }

  /* === FORMULAIRE ÉLÈVE === */
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .step-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .step-header .ornement-petit {
    color: var(--or);
    font-size: 16px;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }
  .step-header h2 {
    font-family: 'Italiana', serif;
    font-size: 36px;
    color: var(--or-clair);
    font-weight: 400;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .step-header p {
    color: var(--gris-clair);
    font-size: 14px;
  }

  .card {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.2);
    padding: 30px;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  .card.bordered {
    border: 2px solid var(--or-fonce);
    position: relative;
  }
  .card.bordered::before, .card.bordered::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border: 2px solid var(--or);
  }
  .card.bordered::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .card.bordered::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--or-clair);
    font-weight: 600;
  }
  .field select, .field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--noir);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: var(--creme);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field select:focus, .field input:focus {
    border-color: var(--or);
  }
  .field select option { background: var(--noir); color: var(--creme); }

  .btn {
    background: linear-gradient(135deg, var(--or-fonce), var(--or));
    color: var(--noir);
    border: none;
    padding: 14px 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    width: 100%;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
  }
  .btn:disabled {
    background: var(--gris);
    color: var(--noir-soft);
    cursor: not-allowed;
    opacity: 0.5;
  }
  .btn-secondaire {
    background: transparent;
    color: var(--or-clair);
    border: 1px solid var(--or-fonce);
  }
  .btn-secondaire:hover:not(:disabled) {
    background: rgba(212, 175, 55, 0.1);
    box-shadow: none;
  }
  .btn-pulse {
    animation: btnPulse 1.6s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
    50% { box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
  }
  .btn-pulse:disabled {
    animation: none;
  }

  .recherche-resultats {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .resultat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--noir);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 2px;
    transition: all 0.2s;
  }
  .resultat.selected {
    border-color: var(--vert-ok);
    background: rgba(77, 140, 90, 0.08);
    box-shadow: inset 0 0 0 1px var(--vert-ok);
  }
  .resultat img {
    width: 56px;
    height: 56px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .resultat-info { flex: 1; min-width: 0; }
  .resultat-titre {
    font-weight: 600;
    color: var(--creme);
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .resultat-artiste {
    font-size: 13px;
    color: var(--gris-clair);
    margin-top: 2px;
  }
  .btn-play {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    color: var(--or);
    border: 1.5px solid var(--or-fonce);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .btn-play:hover {
    background: rgba(212, 175, 55, 0.1);
    border-color: var(--or);
  }
  .btn-play.playing {
    background: var(--rouge);
    color: var(--creme);
    border-color: var(--rouge);
  }
  .btn-choisir {
    flex-shrink: 0;
    background: var(--or);
    color: var(--noir);
    border: none;
    padding: 8px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-choisir:hover {
    background: var(--or-clair);
    transform: scale(1.03);
  }
  .btn-choisir.selected {
    background: var(--vert-ok);
    color: white;
  }

  .alerte {
    padding: 12px 16px;
    border-radius: 2px;
    font-size: 14px;
    margin-top: 16px;
  }
  .alerte.info { background: rgba(212, 175, 55, 0.1); color: var(--or-clair); border-left: 3px solid var(--or); }
  .alerte.erreur { background: rgba(179, 37, 31, 0.15); color: #e88a85; border-left: 3px solid var(--rouge); }
  .alerte.ok { background: rgba(77, 140, 90, 0.15); color: #87c995; border-left: 3px solid var(--vert-ok); }

  .loader {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--or);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === MERCI === */
  .merci {
    text-align: center;
    padding: 60px 20px;
  }
  .merci .ornement {
    font-size: 36px;
    margin-bottom: 30px;
  }
  .merci h2 {
    font-family: 'Italiana', serif;
    font-size: 48px;
    color: var(--or-clair);
    margin-bottom: 16px;
  }
  .merci p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--creme);
    margin-bottom: 8px;
  }
  .merci .titre-confirme {
    margin-top: 30px;
    padding: 20px;
    background: var(--noir-card);
    border: 1px solid var(--or-fonce);
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .merci .titre-confirme img {
    width: 64px; height: 64px;
  }
  .merci .titre-confirme-info { text-align: left; }

  /* === ADMIN === */
  .admin-header {
    background: var(--noir-soft);
    padding: 20px 30px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-header h1 {
    font-family: 'Italiana', serif;
    font-size: 26px;
    color: var(--or-clair);
    font-weight: 400;
    letter-spacing: 1px;
  }
  .admin-header .stats {
    display: flex;
    gap: 24px;
    font-size: 13px;
  }
  .stat-item .stat-num {
    font-family: 'Italiana', serif;
    font-size: 28px;
    color: var(--or);
  }
  .stat-item .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gris-clair);
  }
  .deconnexion {
    background: transparent;
    border: 1px solid var(--gris);
    color: var(--gris-clair);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .deconnexion:hover { border-color: var(--rouge); color: var(--rouge); }

  .btn-export {
    background: transparent;
    border: 1px solid var(--or-fonce);
    color: var(--or-clair);
    padding: 8px 16px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    margin-right: 8px;
  }
  .btn-export:hover {
    background: rgba(212, 175, 55, 0.1);
    border-color: var(--or);
    color: var(--or);
  }
  .btn-export:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .onglets {
    display: flex;
    gap: 4px;
    padding: 0 30px;
    background: var(--noir-soft);
    border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    overflow-x: auto;
    flex-wrap: wrap;
  }
  .onglet {
    background: transparent;
    border: none;
    color: var(--gris-clair);
    padding: 14px 18px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .onglet:hover { color: var(--creme); }
  .onglet.actif {
    color: var(--or);
    border-bottom-color: var(--or);
  }
  .onglet .badge {
    margin-left: 6px;
    background: rgba(212, 175, 55, 0.2);
    color: var(--or-clair);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .onglet.global { color: var(--rouge); font-weight: 600; }
  .onglet.global.actif { border-bottom-color: var(--rouge); }

  .admin-contenu { padding: 30px; }

  .liste-classe {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .ligne-eleve {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.1);
    padding: 14px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ligne-eleve.vote {
    border-color: rgba(212, 175, 55, 0.3);
  }
  .ligne-eleve.pas-vote {
    opacity: 0.5;
  }
  .ligne-eleve img {
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: 2px;
  }
  .ligne-eleve .placeholder-cover {
    width: 44px; height: 44px;
    background: var(--noir);
    border: 1px dashed var(--gris);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--gris);
    border-radius: 2px;
  }
  .ligne-eleve-info { flex: 1; min-width: 0; }
  .ligne-eleve-nom {
    font-size: 13px;
    font-weight: 600;
    color: var(--creme);
  }
  .ligne-eleve-titre {
    font-size: 12px;
    color: var(--gris-clair);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .playlist-globale {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .playlist-ligne {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.15);
    padding: 14px 18px;
    border-radius: 2px;
    display: grid;
    grid-template-columns: 60px 64px 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .playlist-rang {
    font-family: 'Italiana', serif;
    font-size: 24px;
    color: var(--or);
    text-align: center;
  }
  .playlist-cover {
    width: 64px; height: 64px;
    border-radius: 2px;
  }
  .playlist-info-titre {
    font-weight: 600;
    color: var(--creme);
    font-size: 16px;
  }
  .playlist-info-artiste {
    font-size: 13px;
    color: var(--gris-clair);
    margin-top: 2px;
  }
  .playlist-occurrences {
    font-family: 'Italiana', serif;
    font-size: 32px;
    color: var(--or-clair);
    text-align: center;
    min-width: 60px;
  }
  .playlist-occurrences-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gris);
    text-align: center;
  }

  .playlist-vide, .liste-vide {
    text-align: center;
    padding: 60px 20px;
    color: var(--gris-clair);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
  }

  /* Login admin */
  .login-box {
    max-width: 400px;
    margin: 100px auto;
  }

  /* === ANIMATION MERCI === */
  @keyframes merciIn {
    0% { opacity: 0; transform: scale(0.7); }
    60% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes checkDraw {
    0% { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .merci-check {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--vert-ok), #6cb47b);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 60px rgba(77, 140, 90, 0.5);
    animation: merciIn 0.6s ease-out;
  }
  .merci-check svg {
    width: 64px;
    height: 64px;
  }
  .merci-check svg path {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: checkDraw 0.5s ease-out 0.4s forwards;
  }
  .merci-stagger > * {
    opacity: 0;
    animation: fadeUp 0.5s ease-out forwards;
  }
  .merci-stagger > *:nth-child(1) { animation-delay: 0.7s; }
  .merci-stagger > *:nth-child(2) { animation-delay: 0.85s; }
  .merci-stagger > *:nth-child(3) { animation-delay: 1.0s; }
  .merci-stagger > *:nth-child(4) { animation-delay: 1.15s; }
  .merci-stagger > *:nth-child(5) { animation-delay: 1.3s; }

  /* === DRAGON === */
  .dragon-container {
    position: relative;
    max-height: 38vh;
    width: auto;
    margin: 0 auto 8px;
    animation: dragonFloat 4s ease-in-out infinite;
    line-height: 0;
  }
  .dragon-img {
    max-height: 38vh;
    max-width: 200px;
    width: auto;
    height: auto;
    display: block;
    animation: dragonGlow 3.5s ease-in-out infinite;
  }
  @keyframes dragonGlow {
    0%, 100% {
      filter:
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.35))
        drop-shadow(0 0 40px rgba(212, 175, 55, 0.15));
    }
    50% {
      filter:
        drop-shadow(0 0 35px rgba(232, 201, 106, 0.55))
        drop-shadow(0 0 70px rgba(212, 175, 55, 0.3))
        drop-shadow(0 0 100px rgba(255, 140, 40, 0.15));
    }
  }
  @keyframes dragonFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .preview-audio {
    margin-top: 8px;
    width: 100%;
    height: 32px;
  }
  .preview-audio::-webkit-media-controls-panel {
    background-color: var(--noir);
  }

  /* === ÉCRAN CONFIG === */
  .config-screen {
    max-width: 600px;
    margin: 60px auto;
    padding: 30px;
    background: var(--noir-card);
    border: 1px solid var(--rouge);
    border-radius: 2px;
  }
  .config-screen h2 {
    font-family: 'Italiana', serif;
    color: var(--rouge);
    font-size: 24px;
    margin-bottom: 16px;
  }
  .config-screen ol {
    margin: 16px 0;
    padding-left: 24px;
    color: var(--creme);
    line-height: 1.8;
  }
  .config-screen code {
    background: var(--noir);
    padding: 2px 6px;
    color: var(--or-clair);
    font-size: 13px;
    border-radius: 2px;
  }

  @media (max-width: 600px) {
    .playlist-ligne {
      grid-template-columns: 40px 50px 1fr auto;
      gap: 10px;
      padding: 10px 12px;
    }
    .playlist-cover { width: 50px; height: 50px; }
    .playlist-info-titre { font-size: 14px; }
    .playlist-occurrences { font-size: 24px; }
    .admin-header { padding: 14px 16px; }

// ════════════════════════════════════════════════════════════

let deezerCallbackId = 0;
function deezerSearch(query) {
  return new Promise((resolve, reject) => {
    const cbName = 'deezerCb' + (++deezerCallbackId);
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout Deezer'));
    }, 8000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => {
      cleanup();
      resolve(data && data.data ? data.data : []);
    };
    const script = document.createElement('script');
    script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${cbName}&limit=5`;
    script.onerror = () => { cleanup(); reject(new Error('Erreur réseau Deezer')); };
    document.body.appendChild(script);
  });
}

function extractPrenom(nomComplet) {
  // Trouve le premier mot qui n'est pas tout en MAJUSCULES (les noms de famille
  // dans nos listes sont en MAJUSCULES, parfois sur plusieurs mots).
  if (!nomComplet) return '';
  const mots = nomComplet.split(' ');
  for (const m of mots) {
    const sansTiret = m.replace(/-/g, '');
    if (sansTiret && sansTiret !== sansTiret.toUpperCase()) {
      return m;
    }
  }
  return mots[mots.length - 1];
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function voteKey(classe, nom) {
  return `${classe}__${nom}`.replace(/[.#$\[\]\/]/g, '_');
}

function navigate(vue) {
  state.vue = vue;
  if (vue === 'accueil') location.hash = '';
  else if (vue === 'admin-login' || vue === 'admin-dashboard') location.hash = '#/admin';
  else if (vue === 'merci') {
    // On ne touche pas au hash : ça évite tout effet de bord du hashchange.
    // Le state suffit pour afficher la page merci.
  }
  else location.hash = '#/' + vue;
  render();
}

window.addEventListener('hashchange', () => {
  stopPreview();
  const h = location.hash;
  if (h === '#/admin') {
    if (sessionStorage.getItem('balAdminAuth') === 'ok') state.vue = 'admin-dashboard';
    else state.vue = 'admin-login';
  } else if (h === '#/vote') state.vue = 'vote';
  else if (h === '#/merci' && state.voteFinal) state.vue = 'merci';

  render();
});

function startFirebaseListener() {
  if (!firebaseReady) return;
  const votesRef = ref(db, 'votes');
  onValue(votesRef, (snap) => {
    const data = snap.val() || {};
    state.votes = data;
    // Reconstruction des clés "déjà voté"
    state.votedKeys = {};
    Object.values(data).forEach(v => {
      state.votedKeys[voteKey(v.classe, v.nom)] = true;
    });
    render();
  });
}

// Rafraîchit votedKeys via fetch direct (plus fiable que WebSocket sur mobile)
async function rafraichirVotedKeys() {
  if (!firebaseReady) return;
  try {
    const dbUrl = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '');
    const resp = await fetch(dbUrl + '/votedKeys.json', { cache: 'no-store' });
    if (resp.ok) {
      const data = await resp.json();
      state.votedKeys = data || {};
      render();
    }
  } catch (e) {
    console.warn('Rafraîchissement votedKeys échoué:', e);
  }
}

// ════════════════════════════════════════════════════════════
//  ENVOI VOTE
// ════════════════════════════════════════════════════════════

async function envoyerVote() {
  if (!state.classeChoisie || !state.nomChoisi || !state.selectionne) return;
  if (state.enValidation) return;  // anti double-clic
  stopPreview();
  if (!firebaseReady) {
    state.message = { type: 'erreur', texte: "La base de données n'est pas configurée. Contactez un encadrant." };
    render();
    return;
  }

  const k = voteKey(state.classeChoisie, state.nomChoisi);
  const dbUrl = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '');

  // ─── Niveau 1 : check localStorage (le même appareil ne peut pas revoter) ───
  try {
    if (localStorage.getItem('vote_' + k)) {
      state.message = { type: 'erreur', texte: "Une proposition a déjà été envoyée avec ce nom depuis cet appareil." };
      render();
      return;
    }
  } catch (e) { /* localStorage peut être bloqué en mode privé, on ignore */ }

  // ─── Niveau 2 : check mémoire (depuis l'écoute Firebase temps réel) ───
  if (state.votedKeys[k]) {
    state.message = { type: 'erreur', texte: "Une proposition a déjà été enregistrée pour ce nom." };
    render();
    return;
  }

  state.enValidation = true;
  state.message = null;
  render();

  // ─── Niveau 3 : check serveur en direct juste avant d'écrire (anti race-condition) ───
  try {
    const checkController = new AbortController();
    const checkTimeout = setTimeout(() => checkController.abort(), 8000);
    const checkResp = await fetch(dbUrl + '/votedKeys/' + encodeURIComponent(k) + '.json', {
      signal: checkController.signal,
      cache: 'no-store'
    });
    clearTimeout(checkTimeout);
    if (checkResp.ok) {
      const data = await checkResp.json();
      if (data === true) {
        state.message = { type: 'erreur', texte: "Une proposition a déjà été enregistrée pour ce nom." };
        state.enValidation = false;
        // On marque aussi localStorage pour éviter de retenter
        try { localStorage.setItem('vote_' + k, '1'); } catch(e) {}
        render();
        return;
      }
    }
  } catch (e) {
    // Si la vérification échoue (timeout, etc.), on continue : pire des cas, doublon possible
    console.warn('Vérification préalable échouée, on continue:', e);
  }

  const vote = {
    classe: state.classeChoisie,
    nom: state.nomChoisi,
    titre: state.selectionne.title,
    artiste: state.selectionne.artist.name,
    deezerId: state.selectionne.id,
    coverUrl: state.selectionne.album.cover_medium || state.selectionne.album.cover,
    previewUrl: state.selectionne.preview || '',
    timestamp: Date.now()
  };

  const voteId = 'v' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  const updates = {};
  updates['votes/' + voteId] = vote;
  updates['votedKeys/' + k] = true;

  // Timeout via AbortController (25s) pour l'écriture
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);

  try {
    const response = await fetch(dbUrl + '/.json', {
      method: 'PATCH',
      body: JSON.stringify(updates),
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (!response.ok) {
      const txt = await response.text().catch(() => '');
      throw new Error('Serveur HTTP ' + response.status + (txt ? ' : ' + txt.slice(0, 80) : ''));
    }

    // Marquer dans localStorage immédiatement
    try { localStorage.setItem('vote_' + k, '1'); } catch(e) {}
    // Marquer aussi en mémoire pour griser tout de suite l'UI
    state.votedKeys[k] = true;

    state.voteFinal = vote;
    state.enValidation = false;
    state.message = null;
    navigate('merci');
  } catch (e) {
    clearTimeout(timeoutId);
    console.error('Erreur envoi vote:', e);
    let msg;
    if (e.name === 'AbortError') {
      msg = "Délai dépassé. Ta connexion est trop lente. Réessaie.";
    } else {
      msg = "Le vote n'a pas pu être envoyé (" + (e.message || 'erreur réseau') + "). Vérifie ta connexion et clique à nouveau.";
    }
    state.message = { type: 'erreur', texte: msg };
    state.enValidation = false;
    render();
  }
}

// ════════════════════════════════════════════════════════════
//  PREVIEW AUDIO
// ════════════════════════════════════════════════════════════

let audioPreview = null;

function playPreview(id, url) {
  stopPreview();
  audioPreview = new Audio(url);
  audioPreview.volume = 0.7;
  audioPreview.play().catch(e => console.error('Lecture impossible :', e));
  audioPreview.addEventListener('ended', () => {
    state.previewEnCours = null;
    render();
  });
  state.previewEnCours = id;
  render();
}

function stopPreview() {
  if (audioPreview) {
    audioPreview.pause();
    audioPreview.currentTime = 0;
    audioPreview = null;
  }
  state.previewEnCours = null;
}

// ════════════════════════════════════════════════════════════
//  RECHERCHE DEEZER (avec debounce)
// ════════════════════════════════════════════════════════════

function lancerRecherche(query) {
  stopPreview();
  if (!query || query.trim().length < 2) {
    state.message = { type: 'info', texte: "Tape au moins le titre et l'artiste." };
    render();
    return;
  }
  state.enRecherche = true;
  state.message = null;
  render();
  deezerSearch(query).then(res => {
    state.resultats = res;
    state.enRecherche = false;
    if (res.length === 0) {
      state.message = { type: 'info', texte: "Aucun résultat. Vérifie l'orthographe ou ajoute le nom de l'artiste." };
    } else {
      state.message = null;
    }
    render();
  }).catch(e => {
    state.enRecherche = false;
    state.message = { type: 'erreur', texte: "Problème de recherche. Réessaie." };
    render();
  });
}

// ════════════════════════════════════════════════════════════
//  EXPORTS
// ════════════════════════════════════════════════════════════

function aggregerPlaylist() {
  const votesArr = Object.values(state.votes);
  const agreg = {};
  votesArr.forEach(v => {
    const key = v.deezerId;
    if (!agreg[key]) {
      agreg[key] = {
        artiste: v.artiste,
        titre: v.titre,
        count: 0,
        eleves: []
      };
    }
    agreg[key].count++;
    agreg[key].eleves.push({ classe: v.classe, nom: v.nom });
  });
  return Object.values(agreg).sort((a, b) => b.count - a.count);
}

function telecharger(contenu, nomFichier, mimeType) {
  const blob = new Blob([contenu], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomFichier;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 100);
}

function exporterVDJ() {
  const playlist = aggregerPlaylist();
  if (playlist.length === 0) return;
  // Format Virtual DJ : "Artiste - Titre" un par ligne
  const contenu = playlist.map(p => `${p.artiste} - ${p.titre}`).join('\r\n');
  const date = new Date().toISOString().slice(0, 10);
  telecharger(contenu, `playlist-bal-${date}.txt`, 'text/plain');
}

function exporterCSV() {
  const playlist = aggregerPlaylist();
  if (playlist.length === 0) return;
  const escape = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lignes = ['Rang,Artiste,Titre,Votes,Élèves'];
  playlist.forEach((p, i) => {
    const eleves = p.eleves.map(e => `${e.classe} - ${e.nom}`).join(' ; ');
    lignes.push([i + 1, escape(p.artiste), escape(p.titre), p.count, escape(eleves)].join(','));
  });
  // BOM UTF-8 pour qu'Excel reconnaisse les accents
  const contenu = '\uFEFF' + lignes.join('\r\n');
  const date = new Date().toISOString().slice(0, 10);
  telecharger(contenu, `playlist-bal-${date}.csv`, 'text/csv');
}

}

function renderVote() {
  const eleveDejaVote = state.classeChoisie && state.nomChoisi &&
    state.votedKeys[voteKey(state.classeChoisie, state.nomChoisi)];

  return `
    <div class="container">
      <div class="step-header">
        <div class="ornement-petit">◆ ◆ ◆</div>
        <h2>Ta proposition</h2>
        <p>Choisis ton nom et propose-nous un titre</p>
      </div>

      <div class="card bordered">
        <div class="field">
          <label>Ta classe</label>
          <select id="select-classe">
            <option value="">— Choisis ta classe —</option>
            ${Object.keys(STUDENTS).map(c => `
              <option value="${escapeHtml(c)}" ${c === state.classeChoisie ? 'selected' : ''}>${escapeHtml(c)}</option>
            `).join('')}
          </select>
        </div>

        ${state.classeChoisie ? `
          <div class="field">
            <label>Ton nom</label>
            <select id="select-nom">
              <option value="">— Choisis ton nom —</option>
              ${STUDENTS[state.classeChoisie].map(n => {
                const dejaV = state.votedKeys[voteKey(state.classeChoisie, n)];
                return `<option value="${escapeHtml(n)}" ${n === state.nomChoisi ? 'selected' : ''} ${dejaV ? 'disabled' : ''} style="${dejaV ? 'color:#666' : ''}">
                  ${escapeHtml(n)}${dejaV ? '  ✓ déjà choisi' : ''}
                </option>`;
              }).join('')}
            </select>
          </div>
        ` : ''}

        ${eleveDejaVote ? `
          <div class="alerte erreur">
            Tu as déjà proposé un titre. Une seule proposition par élève — c'est figé.
          </div>
        ` : state.nomChoisi ? `
          <div class="field">
            <label>Titre + artiste</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="input-recherche" value="${escapeHtml(state.recherche)}"
                     placeholder="Ex : Shape of You Ed Sheeran" autocomplete="off" style="flex:1"/>
              <button class="btn" data-action="chercher" style="width:auto;padding:14px 22px;flex-shrink:0" ${state.enRecherche ? 'disabled' : ''}>
                ${state.enRecherche ? '<span class="loader"></span>' : 'Chercher'}
              </button>
            </div>
            <p style="font-size:11px;color:var(--gris-clair);margin-top:6px;font-style:italic">Tape titre + artiste, puis clique sur Chercher (ou appuie sur Entrée)</p>
          </div>

          ${state.resultats.length > 0 ? `
            ${!state.selectionne ? `
              <div style="text-align:center;margin:20px 0 14px;color:var(--or-clair);font-size:14px;font-weight:600;letter-spacing:0.5px;line-height:1.5">
                Appuie sur <span style="background:var(--or);color:var(--noir);padding:2px 10px;border-radius:2px;font-weight:700">CHOISIR</span> pour valider ton titre
                <div style="font-size:11px;color:var(--gris-clair);font-weight:400;margin-top:6px;font-style:italic">(tu peux écouter un extrait avec le ▶)</div>
              </div>
            ` : ''}
            <div class="recherche-resultats">
              ${state.resultats.map(r => `
                <div class="resultat ${state.selectionne && state.selectionne.id === r.id ? 'selected' : ''}">
                  <img src="${escapeHtml(r.album.cover_small || r.album.cover)}" alt="" loading="lazy"/>
                  <div class="resultat-info">
                    <div class="resultat-titre">${escapeHtml(r.title)}</div>
                    <div class="resultat-artiste">${escapeHtml(r.artist.name)}</div>
                  </div>
                  ${r.preview ? `
                    <button class="btn-play ${state.previewEnCours === r.id ? 'playing' : ''}"
                            data-action="preview" data-id="${r.id}" data-url="${escapeHtml(r.preview)}"
                            title="Écouter un extrait">
                      ${state.previewEnCours === r.id ? '■' : '▶'}
                    </button>
                  ` : ''}
                  <button class="btn-choisir ${state.selectionne && state.selectionne.id === r.id ? 'selected' : ''}"
                          data-action="selectionner" data-id="${r.id}">
                    ${state.selectionne && state.selectionne.id === r.id ? '✓ CHOISI' : 'CHOISIR'}
                  </button>
                </div>
              `).join('')}
            </div>
          ` : ''}

          ${state.message ? `<div class="alerte ${state.message.type}">${escapeHtml(state.message.texte)}</div>` : ''}

          ${state.selectionne ? `
            <div id="zone-valider" style="margin-top:30px;padding:18px;background:rgba(212,175,55,0.08);border:1.5px solid var(--or);border-radius:2px;text-align:center">
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--or);margin-bottom:8px">Ton choix</div>
              <div style="font-weight:600;color:var(--creme);font-size:16px;margin-bottom:2px">${escapeHtml(state.selectionne.title)}</div>
              <div style="font-size:13px;color:var(--gris-clair);margin-bottom:16px">${escapeHtml(state.selectionne.artist.name)}</div>
              <button class="btn btn-pulse" data-action="valider" ${state.enValidation ? 'disabled' : ''}>
                ${state.enValidation ? '<span class="loader"></span> envoi…' : '✓ Valider ma proposition'}
              </button>
              <p style="text-align:center;font-size:12px;color:var(--gris-clair);margin-top:12px;font-style:italic">
                Une fois validé, tu ne pourras plus changer.
              </p>
            </div>
          ` : ''}
        ` : ''}
      </div>

      <div style="text-align:center;margin-top:20px">
        <a href="#" data-action="retour-accueil" style="color:var(--gris-clair);font-size:13px;text-decoration:none">← retour</a>
      </div>
    </div>
  `;
}

      <div class="merci-check">
        <svg viewBox="0 0 60 60" fill="none">
          <path d="M 14 30 L 26 42 L 46 18" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="merci-stagger">
        <div class="ornement" style="color:var(--or)">◆ ✦ ◆</div>
        <h2>Choix enregistré !</h2>

        ${v ? `

function renderAdminLogin() {
  return `
    <div class="container login-box">
      <div class="step-header">
        <div class="ornement-petit">◆ ◆ ◆</div>
        <h2>Espace encadrants</h2>
        <p>Mot de passe requis</p>
      </div>
      <div class="card bordered">
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="input-password" placeholder="••••••••" autofocus/>
        </div>
        <button class="btn" data-action="connect-admin">Entrer</button>
        ${state.message ? `<div class="alerte ${state.message.type}" style="margin-top:16px">${escapeHtml(state.message.texte)}</div>` : ''}
      </div>
      <div style="text-align:center;margin-top:20px">
        <a href="#" data-action="retour-accueil" style="color:var(--gris-clair);font-size:13px;text-decoration:none">← retour</a>
      </div>
    </div>
  `;
}

function renderAdminDashboard() {
  const votesArr = Object.values(state.votes);
  const totalVotes = votesArr.length;
  const totalEleves = Object.values(STUDENTS).flat().length;
  const pourcent = totalEleves > 0 ? Math.round((totalVotes / totalEleves) * 100) : 0;

  // Comptage par classe
  const parClasse = {};
  Object.keys(STUDENTS).forEach(c => {
    parClasse[c] = votesArr.filter(v => v.classe === c).length;
  });

  // Playlist globale agrégée par deezerId
  const agreg = {};
  votesArr.forEach(v => {
    const key = v.deezerId;
    if (!agreg[key]) {
      agreg[key] = {
        deezerId: v.deezerId,
        titre: v.titre,
        artiste: v.artiste,
        coverUrl: v.coverUrl,
        previewUrl: v.previewUrl,
        count: 0,
        eleves: []
      };
    }
    agreg[key].count++;
    agreg[key].eleves.push({ classe: v.classe, nom: v.nom });
  });
  const playlistTriee = Object.values(agreg).sort((a, b) => b.count - a.count);

  return `
    <div class="admin-header">
      <h1>◆ Coordination — Le Bal</h1>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-num">${totalVotes}</div>
          <div class="stat-label">propositions</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${pourcent}%</div>
          <div class="stat-label">de ${totalEleves} élèves</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">${playlistTriee.length}</div>
          <div class="stat-label">titres uniques</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn-export" data-action="export-vdj" ${totalVotes === 0 ? 'disabled' : ''} title="Fichier .txt à glisser dans Virtual DJ">⬇ Virtual DJ</button>
        <button class="btn-export" data-action="export-csv" ${totalVotes === 0 ? 'disabled' : ''} title="Fichier .csv pour Excel ou archive">⬇ CSV</button>
        <button class="deconnexion" data-action="deconnexion">Déconnexion</button>
      </div>
    </div>

    <div class="onglets">
      <button class="onglet global ${state.ongletActif === 'global' ? 'actif' : ''}" data-onglet="global">
        ★ Playlist globale <span class="badge">${playlistTriee.length}</span>
      </button>
      ${Object.keys(STUDENTS).map(c => `
        <button class="onglet ${state.ongletActif === c ? 'actif' : ''}" data-onglet="${escapeHtml(c)}">
          ${escapeHtml(c)} <span class="badge">${parClasse[c]}/${STUDENTS[c].length}</span>
        </button>
      `).join('')}
    </div>

    <div class="admin-contenu">
      ${state.ongletActif === 'global' ? renderPlaylistGlobale(playlistTriee) : renderClasse(state.ongletActif, votesArr)}
    </div>
  `;
}

function renderPlaylistGlobale(playlist) {
  if (playlist.length === 0) {
    return `<div class="playlist-vide">Aucune proposition pour le moment.</div>`;
  }
  return `
    <div class="playlist-globale">
      ${playlist.map((p, i) => `
        <div class="playlist-ligne">
          <div class="playlist-rang">${i + 1}</div>
          <img src="${escapeHtml(p.coverUrl)}" alt="" class="playlist-cover" loading="lazy"/>
          <div>
            <div class="playlist-info-titre">${escapeHtml(p.titre)}</div>
            <div class="playlist-info-artiste">${escapeHtml(p.artiste)}</div>
            <div style="font-size:11px;color:var(--gris);margin-top:4px">
              ${p.eleves.slice(0, 3).map(e => escapeHtml(e.nom + ' (' + e.classe + ')')).join(' · ')}${p.eleves.length > 3 ? ' · +' + (p.eleves.length - 3) : ''}
            </div>
            ${p.previewUrl ? `<audio controls preload="none" class="preview-audio" src="${escapeHtml(p.previewUrl)}"></audio>` : ''}
          </div>
          <div>
            <div class="playlist-occurrences">×${p.count}</div>
            <div class="playlist-occurrences-label">vote${p.count > 1 ? 's' : ''}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderClasse(classe, votesArr) {
  const eleves = STUDENTS[classe] || [];
  if (eleves.length === 0) return `<div class="liste-vide">Classe inconnue.</div>`;

  // Map nom -> vote
  const votesParNom = {};
  votesArr.filter(v => v.classe === classe).forEach(v => { votesParNom[v.nom] = v; });

  return `
    <div class="liste-classe">
      ${eleves.map(nom => {
        const v = votesParNom[nom];
        if (v) {
          return `
            <div class="ligne-eleve vote">
              <img src="${escapeHtml(v.coverUrl)}" alt="" loading="lazy"/>
              <div class="ligne-eleve-info">
                <div class="ligne-eleve-nom">${escapeHtml(nom)}</div>
                <div class="ligne-eleve-titre">${escapeHtml(v.titre)} — ${escapeHtml(v.artiste)}</div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="ligne-eleve pas-vote">
              <div class="placeholder-cover">♪</div>
              <div class="ligne-eleve-info">
                <div class="ligne-eleve-nom">${escapeHtml(nom)}</div>
                <div class="ligne-eleve-titre">— pas encore proposé —</div>
              </div>
            </div>
          `;
        }
      }).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
//  ÉVÉNEMENTS
// ════════════════════════════════════════════════════════════

function attachEvents() {
  // Boutons globaux par data-action
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', (e) => {
      const action = el.getAttribute('data-action');

      if (action === 'aller-vote') {
        stopPreview();
        state.classeChoisie = '';
        state.nomChoisi = '';
        state.recherche = '';
        state.resultats = [];
        state.selectionne = null;
        state.message = null;
        navigate('vote');
        rafraichirVotedKeys();  // récupérer la liste à jour des élèves ayant déjà voté
      }
      else if (action === 'retour-accueil') {
        e.preventDefault();
        stopPreview();
        navigate('accueil');
      }
      else if (action === 'selectionner') {
        const id = parseInt(el.getAttribute('data-id'));
        state.selectionne = state.resultats.find(r => r.id === id);
        render();
        // Scroll automatique vers le bouton de validation
        setTimeout(() => {
          const zone = document.getElementById('zone-valider');
          if (zone) zone.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
      else if (action === 'valider') {
        envoyerVote();
      }
      else if (action === 'chercher') {
        const inp = document.getElementById('input-recherche');
        const val = inp ? inp.value : state.recherche;
        state.recherche = val;
        state.selectionne = null;
        lancerRecherche(val);
      }
      else if (action === 'preview') {
        e.stopPropagation();
        const id = parseInt(el.getAttribute('data-id'));
        const url = el.getAttribute('data-url');
        // Si on clique sur le bouton du morceau en cours, on stoppe
        if (state.previewEnCours === id) {
          stopPreview();
        } else {
          playPreview(id, url);
        }
      }
      else if (action === 'connect-admin') {
        const pwd = document.getElementById('input-password').value;
        if (pwd === ADMIN_PASSWORD) {
          sessionStorage.setItem('balAdminAuth', 'ok');
          state.message = null;
          state.vue = 'admin-dashboard';
          render();
        } else {
          state.message = { type: 'erreur', texte: "Mot de passe incorrect." };
          render();
        }
      }
      else if (action === 'deconnexion') {
        sessionStorage.removeItem('balAdminAuth');
        navigate('accueil');
      }
      else if (action === 'export-vdj') {
        exporterVDJ();
      }
      else if (action === 'export-csv') {
        exporterCSV();
      }
    });
  });

  // Select classe
  const selectClasse = document.getElementById('select-classe');
  if (selectClasse) {
    selectClasse.addEventListener('change', (e) => {
      stopPreview();
      state.classeChoisie = e.target.value;
      state.nomChoisi = '';
      state.recherche = '';
      state.resultats = [];
      state.selectionne = null;
      state.message = null;
      render();
      rafraichirVotedKeys();  // récupérer la liste la plus à jour
    });
  }

  // Select nom
  const selectNom = document.getElementById('select-nom');
  if (selectNom) {
    selectNom.addEventListener('change', (e) => {
      stopPreview();
      state.nomChoisi = e.target.value;
      state.recherche = '';
      state.resultats = [];
      state.selectionne = null;
      state.message = null;
      render();
      setTimeout(() => {
        const inp = document.getElementById('input-recherche');
        if (inp) inp.focus();
      }, 50);
    });
  }

  // Input recherche : on enregistre la valeur sans déclencher de recherche
  const inputRecherche = document.getElementById('input-recherche');
  if (inputRecherche) {
    inputRecherche.addEventListener('input', (e) => {
      state.recherche = e.target.value;
      // pas de re-render ici pour éviter de perdre le focus
    });
    inputRecherche.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        lancerRecherche(state.recherche);
      }
    });
  }

  // Onglets admin
  document.querySelectorAll('[data-onglet]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.ongletActif = btn.getAttribute('data-onglet');
      render();
    });
  });

  // Login enter key
  const inputPwd = document.getElementById('input-password');
  if (inputPwd) {
    inputPwd.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.querySelector('[data-action="connect-admin"]').click();
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  INITIALISATION
// ════════════════════════════════════════════════════════════

// Détection vue depuis l'URL au chargement
const initialHash = location.hash;
if (initialHash === '#/admin') {
  state.vue = sessionStorage.getItem('balAdminAuth') === 'ok' ? 'admin-dashboard' : 'admin-login';
} else if (initialHash === '#/vote') {
  state.vue = 'vote';
} else if (initialHash === '#/merci') {
  state.vue = 'accueil';  // pas de retour direct sur merci sans avoir voté
}

if (firebaseReady) startFirebaseListener();
render();
</script>
