<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bal des 3èmes — Camille Sée</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet" />
<style>
  :root {
    --noir: #0b0a0a;
    --noir-soft: #161413;
    --noir-card: #1d1a18;
    --or: #d4af37;
    --or-clair: #e8c96a;
    --or-fonce: #9c7d20;
    --creme: #f4ead5;
    --rouge: #b3251f;
    --gris: #6b6358;
    --gris-clair: #c9c1b3;
    --vert-ok: #4d8c5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--noir);
    color: var(--creme);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background décoratif Art Déco */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(179, 37, 31, 0.06), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0, transparent 60px, rgba(212, 175, 55, 0.015) 60px, rgba(212, 175, 55, 0.015) 61px);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* === ACCUEIL === */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    position: relative;
  }
  .ornement {
    color: var(--or);
    font-size: 28px;
    letter-spacing: 12px;
    margin-bottom: 20px;
    opacity: 0.8;
  }
  .hero h1 {
    font-family: 'Italiana', serif;
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 400;
    color: var(--or-clair);
    line-height: 1;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
  }
  .hero h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 400;
    font-style: italic;
    color: var(--creme);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .hero .college {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gris-clair);
    opacity: 0.7;
    margin-bottom: 50px;
  }
  .cta-principal {
    background: linear-gradient(135deg, var(--or-fonce), var(--or));
    color: var(--noir);
    border: none;
    padding: 20px 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25);
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .cta-principal:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4);
  }
  .accueil-sous-texte {
    margin-top: 30px;
    font-size: 14px;
    color: var(--gris-clair);
    max-width: 500px;
    line-height: 1.6;
    font-style: italic;
  }
  .lien-admin {
    position: absolute;
    bottom: 20px;
    right: 20px;
    color: var(--gris);
    font-size: 11px;
    text-decoration: none;
    letter-spacing: 1px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .lien-admin:hover { opacity: 1; color: var(--or); }

  /* === FORMULAIRE ÉLÈVE === */
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .step-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .step-header .ornement-petit {
    color: var(--or);
    font-size: 16px;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }
  .step-header h2 {
    font-family: 'Italiana', serif;
    font-size: 36px;
    color: var(--or-clair);
    font-weight: 400;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .step-header p {
    color: var(--gris-clair);
    font-size: 14px;
  }

  .card {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.2);
    padding: 30px;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  .card.bordered {
    border: 2px solid var(--or-fonce);
    position: relative;
  }
  .card.bordered::before, .card.bordered::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border: 2px solid var(--or);
  }
  .card.bordered::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .card.bordered::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--or-clair);
    font-weight: 600;
  }
  .field select, .field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--noir);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: var(--creme);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field select:focus, .field input:focus {
    border-color: var(--or);
  }
  .field select option { background: var(--noir); color: var(--creme); }

  .btn {
    background: linear-gradient(135deg, var(--or-fonce), var(--or));
    color: var(--noir);
    border: none;
    padding: 14px 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    width: 100%;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
  }
  .btn:disabled {
    background: var(--gris);
    color: var(--noir-soft);
    cursor: not-allowed;
    opacity: 0.5;
  }
  .btn-secondaire {
    background: transparent;
    color: var(--or-clair);
    border: 1px solid var(--or-fonce);
  }
  .btn-secondaire:hover:not(:disabled) {
    background: rgba(212, 175, 55, 0.1);
    box-shadow: none;
  }

  .recherche-resultats {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .resultat {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    background: var(--noir);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .resultat:hover {
    border-color: var(--or);
    background: rgba(212, 175, 55, 0.05);
  }
  .resultat.selected {
    border-color: var(--or);
    background: rgba(212, 175, 55, 0.1);
    box-shadow: inset 0 0 0 1px var(--or);
  }
  .resultat img {
    width: 56px;
    height: 56px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .resultat-info { flex: 1; min-width: 0; }
  .resultat-titre {
    font-weight: 600;
    color: var(--creme);
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .resultat-artiste {
    font-size: 13px;
    color: var(--gris-clair);
    margin-top: 2px;
  }
  .btn-play {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--or);
    color: var(--noir);
    border: none;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .btn-play:hover {
    background: var(--or-clair);
    transform: scale(1.05);
  }
  .btn-play.playing {
    background: var(--rouge);
    color: var(--creme);
  }

  .alerte {
    padding: 12px 16px;
    border-radius: 2px;
    font-size: 14px;
    margin-top: 16px;
  }
  .alerte.info { background: rgba(212, 175, 55, 0.1); color: var(--or-clair); border-left: 3px solid var(--or); }
  .alerte.erreur { background: rgba(179, 37, 31, 0.15); color: #e88a85; border-left: 3px solid var(--rouge); }
  .alerte.ok { background: rgba(77, 140, 90, 0.15); color: #87c995; border-left: 3px solid var(--vert-ok); }

  .loader {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--or);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === MERCI === */
  .merci {
    text-align: center;
    padding: 60px 20px;
  }
  .merci .ornement {
    font-size: 36px;
    margin-bottom: 30px;
  }
  .merci h2 {
    font-family: 'Italiana', serif;
    font-size: 48px;
    color: var(--or-clair);
    margin-bottom: 16px;
  }
  .merci p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--creme);
    margin-bottom: 8px;
  }
  .merci .titre-confirme {
    margin-top: 30px;
    padding: 20px;
    background: var(--noir-card);
    border: 1px solid var(--or-fonce);
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .merci .titre-confirme img {
    width: 64px; height: 64px;
  }
  .merci .titre-confirme-info { text-align: left; }

  /* === ADMIN === */
  .admin-header {
    background: var(--noir-soft);
    padding: 20px 30px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-header h1 {
    font-family: 'Italiana', serif;
    font-size: 26px;
    color: var(--or-clair);
    font-weight: 400;
    letter-spacing: 1px;
  }
  .admin-header .stats {
    display: flex;
    gap: 24px;
    font-size: 13px;
  }
  .stat-item .stat-num {
    font-family: 'Italiana', serif;
    font-size: 28px;
    color: var(--or);
  }
  .stat-item .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gris-clair);
  }
  .deconnexion {
    background: transparent;
    border: 1px solid var(--gris);
    color: var(--gris-clair);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .deconnexion:hover { border-color: var(--rouge); color: var(--rouge); }

  .onglets {
    display: flex;
    gap: 4px;
    padding: 0 30px;
    background: var(--noir-soft);
    border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    overflow-x: auto;
    flex-wrap: wrap;
  }
  .onglet {
    background: transparent;
    border: none;
    color: var(--gris-clair);
    padding: 14px 18px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .onglet:hover { color: var(--creme); }
  .onglet.actif {
    color: var(--or);
    border-bottom-color: var(--or);
  }
  .onglet .badge {
    margin-left: 6px;
    background: rgba(212, 175, 55, 0.2);
    color: var(--or-clair);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .onglet.global { color: var(--rouge); font-weight: 600; }
  .onglet.global.actif { border-bottom-color: var(--rouge); }

  .admin-contenu { padding: 30px; }

  .liste-classe {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .ligne-eleve {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.1);
    padding: 14px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ligne-eleve.vote {
    border-color: rgba(212, 175, 55, 0.3);
  }
  .ligne-eleve.pas-vote {
    opacity: 0.5;
  }
  .ligne-eleve img {
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: 2px;
  }
  .ligne-eleve .placeholder-cover {
    width: 44px; height: 44px;
    background: var(--noir);
    border: 1px dashed var(--gris);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--gris);
    border-radius: 2px;
  }
  .ligne-eleve-info { flex: 1; min-width: 0; }
  .ligne-eleve-nom {
    font-size: 13px;
    font-weight: 600;
    color: var(--creme);
  }
  .ligne-eleve-titre {
    font-size: 12px;
    color: var(--gris-clair);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .playlist-globale {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .playlist-ligne {
    background: var(--noir-card);
    border: 1px solid rgba(212, 175, 55, 0.15);
    padding: 14px 18px;
    border-radius: 2px;
    display: grid;
    grid-template-columns: 60px 64px 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .playlist-rang {
    font-family: 'Italiana', serif;
    font-size: 24px;
    color: var(--or);
    text-align: center;
  }
  .playlist-cover {
    width: 64px; height: 64px;
    border-radius: 2px;
  }
  .playlist-info-titre {
    font-weight: 600;
    color: var(--creme);
    font-size: 16px;
  }
  .playlist-info-artiste {
    font-size: 13px;
    color: var(--gris-clair);
    margin-top: 2px;
  }
  .playlist-occurrences {
    font-family: 'Italiana', serif;
    font-size: 32px;
    color: var(--or-clair);
    text-align: center;
    min-width: 60px;
  }
  .playlist-occurrences-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gris);
    text-align: center;
  }

  .playlist-vide, .liste-vide {
    text-align: center;
    padding: 60px 20px;
    color: var(--gris-clair);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
  }

  /* Login admin */
  .login-box {
    max-width: 400px;
    margin: 100px auto;
  }

  /* === RECAP / DETAILS POPUP === */
  .preview-audio {
    margin-top: 8px;
    width: 100%;
    height: 32px;
  }
  .preview-audio::-webkit-media-controls-panel {
    background-color: var(--noir);
  }

  /* === ÉCRAN CONFIG === */
  .config-screen {
    max-width: 600px;
    margin: 60px auto;
    padding: 30px;
    background: var(--noir-card);
    border: 1px solid var(--rouge);
    border-radius: 2px;
  }
  .config-screen h2 {
    font-family: 'Italiana', serif;
    color: var(--rouge);
    font-size: 24px;
    margin-bottom: 16px;
  }
  .config-screen ol {
    margin: 16px 0;
    padding-left: 24px;
    color: var(--creme);
    line-height: 1.8;
  }
  .config-screen code {
    background: var(--noir);
    padding: 2px 6px;
    color: var(--or-clair);
    font-size: 13px;
    border-radius: 2px;
  }

  @media (max-width: 600px) {
    .playlist-ligne {
      grid-template-columns: 40px 50px 1fr auto;
      gap: 10px;
      padding: 10px 12px;
    }
    .playlist-cover { width: 50px; height: 50px; }
    .playlist-info-titre { font-size: 14px; }
    .playlist-occurrences { font-size: 24px; }
    .admin-header { padding: 14px 16px; }
    .admin-contenu { padding: 16px; }
    .onglets { padding: 0 10px; }
  }
</style>
</head>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, get, onValue, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

let db = null;
let firebaseReady = false;

function checkFirebaseConfig() {
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "REMPLACE_MOI";
}

if (checkFirebaseConfig()) {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    firebaseReady = true;
  } catch (e) {
    console.error("Erreur Firebase :", e);
  }
}

// ════════════════════════════════════════════════════════════
//  DEEZER (recherche en JSONP pour contourner CORS)
// ════════════════════════════════════════════════════════════

let deezerCallbackId = 0;
function deezerSearch(query) {
  return new Promise((resolve, reject) => {
    const cbName = 'deezerCb' + (++deezerCallbackId);
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout Deezer'));
    }, 8000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => {
      cleanup();
      resolve(data && data.data ? data.data : []);
    };
    const script = document.createElement('script');
    script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${cbName}&limit=5`;
    script.onerror = () => { cleanup(); reject(new Error('Erreur réseau Deezer')); };
    document.body.appendChild(script);
  });
}

// ════════════════════════════════════════════════════════════
//  UTILITAIRES
// ════════════════════════════════════════════════════════════

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function voteKey(classe, nom) {
  return `${classe}__${nom}`.replace(/[.#$\[\]\/]/g, '_');
}

function navigate(vue) {
  state.vue = vue;
  if (vue === 'accueil') location.hash = '';
  else if (vue === 'admin-login' || vue === 'admin-dashboard') location.hash = '#/admin';
  else location.hash = '#/' + vue;
  render();
}

window.addEventListener('hashchange', () => {
  stopPreview();
  const h = location.hash;
  if (h === '#/admin') {
    if (sessionStorage.getItem('balAdminAuth') === 'ok') state.vue = 'admin-dashboard';
    else state.vue = 'admin-login';
  } else if (h === '#/vote') state.vue = 'vote';
  else state.vue = 'accueil';
  render();
});

// ════════════════════════════════════════════════════════════
//  ÉCOUTE FIREBASE EN TEMPS RÉEL
// ════════════════════════════════════════════════════════════

function startFirebaseListener() {
  if (!firebaseReady) return;
  const votesRef = ref(db, 'votes');
  onValue(votesRef, (snap) => {
    const data = snap.val() || {};
    state.votes = data;
    // Reconstruction des clés "déjà voté"
    state.votedKeys = {};
    Object.values(data).forEach(v => {
      state.votedKeys[voteKey(v.classe, v.nom)] = true;
    });
    render();
  });
}

// ════════════════════════════════════════════════════════════
//  ENVOI VOTE
// ════════════════════════════════════════════════════════════

async function envoyerVote() {
  if (!state.classeChoisie || !state.nomChoisi || !state.selectionne) return;
  stopPreview();
  if (!firebaseReady) {
    state.message = { type: 'erreur', texte: "La base de données n'est pas configurée. Contactez un encadrant." };
    render();
    return;
  }

  const k = voteKey(state.classeChoisie, state.nomChoisi);
  // Re-vérification anti double-vote
  const dejaRef = ref(db, 'votedKeys/' + k);
  const dejaSnap = await get(dejaRef);
  if (dejaSnap.exists()) {
    state.message = { type: 'erreur', texte: "Tu as déjà proposé un titre. Une seule proposition par élève." };
    state.enValidation = false;
    render();
    return;
  }

  state.enValidation = true;
  render();

  try {
    const vote = {
      classe: state.classeChoisie,
      nom: state.nomChoisi,
      titre: state.selectionne.title,
      artiste: state.selectionne.artist.name,
      deezerId: state.selectionne.id,
      coverUrl: state.selectionne.album.cover_medium || state.selectionne.album.cover,
      previewUrl: state.selectionne.preview || '',
      timestamp: Date.now()
    };
    const newRef = push(ref(db, 'votes'));
    await set(newRef, vote);
    await set(ref(db, 'votedKeys/' + k), true);

    state.voteFinal = vote;
    state.enValidation = false;
    state.message = null;
    navigate('merci');
  } catch (e) {
    console.error(e);
    state.message = { type: 'erreur', texte: "Erreur d'envoi : " + e.message };
    state.enValidation = false;
    render();
  }
}

// ════════════════════════════════════════════════════════════
//  PREVIEW AUDIO
// ════════════════════════════════════════════════════════════

let audioPreview = null;

function playPreview(id, url) {
  stopPreview();
  audioPreview = new Audio(url);
  audioPreview.volume = 0.7;
  audioPreview.play().catch(e => console.error('Lecture impossible :', e));
  audioPreview.addEventListener('ended', () => {
    state.previewEnCours = null;
    render();
  });
  state.previewEnCours = id;
  render();
}

function stopPreview() {
  if (audioPreview) {
    audioPreview.pause();
    audioPreview.currentTime = 0;
    audioPreview = null;
  }
  state.previewEnCours = null;
}

// ════════════════════════════════════════════════════════════
//  RECHERCHE DEEZER (avec debounce)
// ════════════════════════════════════════════════════════════

function lancerRecherche(query) {
  stopPreview();
  if (!query || query.trim().length < 2) {
    state.message = { type: 'info', texte: "Tape au moins le titre et l'artiste." };
    render();
    return;
  }
  state.enRecherche = true;
  state.message = null;
  render();
  deezerSearch(query).then(res => {
    state.resultats = res;
    state.enRecherche = false;
    if (res.length === 0) {
      state.message = { type: 'info', texte: "Aucun résultat. Vérifie l'orthographe ou ajoute le nom de l'artiste." };
    } else {
      state.message = null;
    }
    render();
  }).catch(e => {
    state.enRecherche = false;
    state.message = { type: 'erreur', texte: "Problème de recherche. Réessaie." };
    render();
  });
}

function render() {
  const app = document.getElementById('app');

  if (!checkFirebaseConfig()) {
    app.innerHTML = renderConfigNeeded();
    return;
  }

  if (state.vue === 'accueil') app.innerHTML = renderAccueil();
  else if (state.vue === 'vote') app.innerHTML = renderVote();
  else if (state.vue === 'merci') app.innerHTML = renderMerci();
  else if (state.vue === 'admin-login') app.innerHTML = renderAdminLogin();
  else if (state.vue === 'admin-dashboard') app.innerHTML = renderAdminDashboard();
  else app.innerHTML = renderAccueil();

  attachEvents();
}

function renderAdminDashboard() {
  const votesArr = Object.values(state.votes);
  const totalVotes = votesArr.length;
  const totalEleves = Object.values(STUDENTS).flat().length;
  const pourcent = totalEleves > 0 ? Math.round((totalVotes / totalEleves) * 100) : 0;

  // Comptage par classe
  const parClasse = {};
  Object.keys(STUDENTS).forEach(c => {
    parClasse[c] = votesArr.filter(v => v.classe === c).length;
  });

  // Playlist globale agrégée par deezerId
  const agreg = {};
  votesArr.forEach(v => {
    const key = v.deezerId;
    if (!agreg[key]) {
      agreg[key] = {
        deezerId: v.deezerId,
        titre: v.titre,
        artiste: v.artiste,
        coverUrl: v.coverUrl,
        previewUrl: v.previewUrl,
        count: 0,
        eleves: []
      };
    }
    agreg[key].count++;
    agreg[key].eleves.push({ classe: v.classe, nom: v.nom });
  });
  const playlistTriee = Object.values(agreg).sort((a, b) => b.count - a.count);

  return `

        <button class="onglet ${state.ongletActif === c ? 'actif' : ''}" data-onglet="${escapeHtml(c)}">
          ${escapeHtml(c)} <span class="badge">${parClasse[c]}/${STUDENTS[c].length}</span>

}

  }
  return `
    <div class="playlist-globale">
      ${playlist.map((p, i) => `

function renderClasse(classe, votesArr) {
  const eleves = STUDENTS[classe] || [];
  if (eleves.length === 0) return `<div class="liste-vide">Classe inconnue.</div>`;

  // Map nom -> vote
  const votesParNom = {};
  votesArr.filter(v => v.classe === classe).forEach(v => { votesParNom[v.nom] = v; });

  return `
    <div class="liste-classe">
      ${eleves.map(nom => {
        const v = votesParNom[nom];
        if (v) {
          return `
            <div class="ligne-eleve vote">
              <img src="${escapeHtml(v.coverUrl)}" alt="" loading="lazy"/>
              <div class="ligne-eleve-info">
                <div class="ligne-eleve-nom">${escapeHtml(nom)}</div>
                <div class="ligne-eleve-titre">${escapeHtml(v.titre)} — ${escapeHtml(v.artiste)}</div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="ligne-eleve pas-vote">
              <div class="placeholder-cover">♪</div>
              <div class="ligne-eleve-info">
                <div class="ligne-eleve-nom">${escapeHtml(nom)}</div>
                <div class="ligne-eleve-titre">— pas encore proposé —</div>
              </div>
            </div>
          `;
        }
      }).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
//  ÉVÉNEMENTS
// ════════════════════════════════════════════════════════════

function attachEvents() {
  // Boutons globaux par data-action
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', (e) => {
      const action = el.getAttribute('data-action');

      if (action === 'aller-vote') {
        stopPreview();
        state.classeChoisie = '';
        state.nomChoisi = '';
        state.recherche = '';
        state.resultats = [];
        state.selectionne = null;
        state.message = null;
        navigate('vote');
      }
      else if (action === 'retour-accueil') {
        e.preventDefault();
        stopPreview();
        navigate('accueil');
      }
      else if (action === 'selectionner') {
        const id = parseInt(el.getAttribute('data-id'));
        state.selectionne = state.resultats.find(r => r.id === id);
        render();
      }
      else if (action === 'valider') {
        envoyerVote();
      }
      else if (action === 'chercher') {
        const inp = document.getElementById('input-recherche');
        const val = inp ? inp.value : state.recherche;
        state.recherche = val;
        state.selectionne = null;
        lancerRecherche(val);
      }
      else if (action === 'preview') {
        e.stopPropagation();
        const id = parseInt(el.getAttribute('data-id'));
        const url = el.getAttribute('data-url');
        // Si on clique sur le bouton du morceau en cours, on stoppe
        if (state.previewEnCours === id) {
          stopPreview();
        } else {
          playPreview(id, url);
        }
      }
      else if (action === 'connect-admin') {
        const pwd = document.getElementById('input-password').value;
        if (pwd === ADMIN_PASSWORD) {
          sessionStorage.setItem('balAdminAuth', 'ok');
          state.message = null;
          state.vue = 'admin-dashboard';
          render();
        } else {
          state.message = { type: 'erreur', texte: "Mot de passe incorrect." };
          render();
        }
      }
      else if (action === 'deconnexion') {
        sessionStorage.removeItem('balAdminAuth');
        navigate('accueil');
      }
    });
  });

  // Select classe
  const selectClasse = document.getElementById('select-classe');
  if (selectClasse) {
    selectClasse.addEventListener('change', (e) => {
      stopPreview();
      state.classeChoisie = e.target.value;
      state.nomChoisi = '';
      state.recherche = '';
      state.resultats = [];
      state.selectionne = null;
      state.message = null;
      render();
    });
  }

  // Select nom
  const selectNom = document.getElementById('select-nom');
  if (selectNom) {
    selectNom.addEventListener('change', (e) => {
      stopPreview();
      state.nomChoisi = e.target.value;
      state.recherche = '';
      state.resultats = [];
      state.selectionne = null;
      state.message = null;
      render();
      setTimeout(() => {
        const inp = document.getElementById('input-recherche');
        if (inp) inp.focus();
      }, 50);
    });
  }

  // Input recherche : on enregistre la valeur sans déclencher de recherche
  const inputRecherche = document.getElementById('input-recherche');
  if (inputRecherche) {
    inputRecherche.addEventListener('input', (e) => {
      state.recherche = e.target.value;
      // pas de re-render ici pour éviter de perdre le focus
    });
    inputRecherche.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        lancerRecherche(state.recherche);
      }
    });
  }

  // Onglets admin
  document.querySelectorAll('[data-onglet]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.ongletActif = btn.getAttribute('data-onglet');
      render();
    });
  });

  // Login enter key
  const inputPwd = document.getElementById('input-password');
  if (inputPwd) {
    inputPwd.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.querySelector('[data-action="connect-admin"]').click();
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  INITIALISATION
// ════════════════════════════════════════════════════════════

// Détection vue depuis l'URL au chargement
const initialHash = location.hash;
if (initialHash === '#/admin') {
  state.vue = sessionStorage.getItem('balAdminAuth') === 'ok' ? 'admin-dashboard' : 'admin-login';
} else if (initialHash === '#/vote') {
  state.vue = 'vote';
} else if (initialHash === '#/merci') {
  state.vue = 'accueil';  // pas de retour direct sur merci sans avoir voté
}

if (firebaseReady) startFirebaseListener();
render();
</script>
</body>
</html>
