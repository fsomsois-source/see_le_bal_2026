<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Clos — Bal du Dragon</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Italiana&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: 'Cormorant Garamond', serif;
  }

  /* Fond texturé or très subtil */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #1a1200 0%, #0a0800 50%, #000 100%);
    z-index: 0;
  }

  /* Particules dorées */
  .embers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .ember {
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #c9a84c;
    animation: rise linear infinite;
    opacity: 0;
  }

  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(1);   opacity: 0; }
    10%  { opacity: 0.8; }
    80%  { opacity: 0.4; }
    100% { transform: translateY(-100vh) translateX(var(--drift)) scale(0.2); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    padding: 2rem;
    text-align: center;
    max-width: 700px;
  }

  .dragon-img {
    width: clamp(120px, 20vw, 200px);
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.6)) drop-shadow(0 0 40px rgba(201,168,76,0.3));
    animation: dragonPulse 3s ease-in-out infinite;
  }

  @keyframes dragonPulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(201,168,76,0.6)) drop-shadow(0 0 40px rgba(201,168,76,0.3)); }
    50%       { filter: drop-shadow(0 0 30px rgba(201,168,76,0.9)) drop-shadow(0 0 60px rgba(201,168,76,0.5)); }
  }

  .titre-clos {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    font-weight: 900;
    color: #c9a84c;
    text-shadow: 0 0 20px rgba(201,168,76,0.5), 0 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .separateur {
    width: clamp(200px, 50vw, 400px);
    height: 1px;
    background: linear-gradient(to right, transparent, #c9a84c, transparent);
    position: relative;
  }
  .separateur::before, .separateur::after {
    content: '✦';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #c9a84c;
    font-size: 0.7rem;
  }
  .separateur::before { left: 30%; }
  .separateur::after  { right: 30%; }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    color: #e8d5a3;
    line-height: 1.7;
    font-style: italic;
    max-width: 520px;
  }

  .message strong {
    font-style: normal;
    font-weight: 600;
    color: #c9a84c;
  }

  .rendez-vous {
    font-family: 'Italiana', serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: #c9a84c;
    letter-spacing: 0.08em;
    text-shadow: 0 0 15px rgba(201,168,76,0.4);
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.85; }
    50%       { opacity: 1; text-shadow: 0 0 25px rgba(201,168,76,0.7); }
  }

  .chaudron-img {
    width: clamp(140px, 22vw, 220px);
    filter: drop-shadow(0 0 15px rgba(201,168,76,0.3));
    animation: cauldronFloat 4s ease-in-out infinite;
  }

  @keyframes cauldronFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  .ornement {
    font-family: 'Cormorant Garamond', serif;
    color: #5a4a2a;
    font-size: 1.2rem;
    letter-spacing: 0.4em;
  }
</style>
</head>
<body>

<div class="embers" id="embers"></div>

<div class="container">

  <img class="dragon-img" id="dragonImg" src="" alt="Dragon">

  <div class="titre-clos">Le Vote est Clos</div>

  <div class="separateur"></div>

  <p class="message">
    Les urnes ont parlé.<br>
    <strong>Merci à tous d'avoir voté.</strong><br>
    Le destin du Bal est désormais scellé.
  </p>

  <div class="rendez-vous">✦ Rendez-vous dans l'Antre du Dragon ✦</div>

  <div class="separateur"></div>

  <img class="chaudron-img" src="https://raw.githubusercontent.com/fsomsois-source/ElectionBal/main/Chaudron.png" alt="Chaudron">

  <div class="ornement">— B A L   D U   D R A G O N —</div>

</div>

// Particules
const embers = document.getElementById('embers');
for (let i = 0; i < 30; i++) {
  const e = document.createElement('div');
  e.className = 'ember';
  e.style.left = Math.random() * 100 + '%';
  e.style.animationDuration = (4 + Math.random() * 8) + 's';
  e.style.animationDelay = (Math.random() * 8) + 's';
  e.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
  e.style.width = e.style.height = (2 + Math.random() * 3) + 'px';
  const hue = Math.random() > 0.5 ? '#c9a84c' : '#e05c2a';
  e.style.background = hue;
  embers.appendChild(e);
}
